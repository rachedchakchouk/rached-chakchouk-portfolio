<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Message envoyé · Rached Chakchouk</title>
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<style>
:root { --bg: #f6f7fb; --fg: #0b1324; --muted: #5a667a; --card: #fff; --rule: #e2e7ef; --accent: #2563c9; }
@media (prefers-color-scheme: dark) { :root { --bg: #070b14; --fg: #eef2f8; --muted: #97a3b8; --card: #0f1522; --rule: #1e2738; --accent: #6ea8ff; color-scheme: dark; } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 16px/1.6 "Segoe UI", system-ui, sans-serif; padding: 20px; }
.card { max-width: 460px; background: var(--card); border: 1px solid var(--rule); border-radius: 22px; padding: 32px; text-align: center; }
h1 { margin: 0 0 8px; font-size: 26px; } p { color: var(--muted); margin: 0 0 20px; }
a { display: inline-block; background: var(--fg); color: var(--bg); text-decoration: none; padding: 11px 20px; border-radius: 999px; font-weight: 600; }
</style>
</head>
<body>
<div class="card">
  <h1>Message envoyé ✓</h1>
  <p>Merci ! Je vous réponds rapidement.<br><span lang="en">Thank you, I will get back to you shortly.</span></p>
  <a href="/">Retour au portfolio</a>
</div>
</body>
</html>
