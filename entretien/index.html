<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>102 questions d'entretien – Java, Spring, Angular</title>
<meta name="description" content="102 questions d'entretien technique Java, Spring Boot, JPA, SQL, Angular, RxJS, REST, Git et Docker, expliquées simplement avec un schéma animé. FR / EN.">
<link rel="icon" href="/favicon-32.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--bg:#eef1f5;--panel:#fff;--fg:#1a2230;--muted:#5b6577;--line:#d3d9e2;--accent:#2f5beA;--chip:#e6ecfb}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121821;--panel:#1b2330;--fg:#e6eaf2;--muted:#9aa4b5;--line:#2c3646;--accent:#7c9bff;--chip:#24304a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121821;--panel:#1b2330;--fg:#e6eaf2;--muted:#9aa4b5;--line:#2c3646;--accent:#7c9bff;--chip:#24304a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 "Archivo",system-ui,sans-serif;padding:20px max(16px,env(safe-area-inset-left,0px)) 48px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.back{color:var(--accent);text-decoration:none;font-weight:600}
h1{font-weight:800;font-size:clamp(24px,4.5vw,38px);margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:0;max-width:72ch}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0;display:flex;flex-wrap:wrap;gap:8px;border-bottom:1px solid var(--line)}
.bar button,.bar a.dl{font:600 13px "Archivo",sans-serif;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:999px;padding:7px 13px;cursor:pointer;text-decoration:none}
.bar button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.bar .sp{flex:1}
input[type=search]{font:inherit;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 13px;flex:1 1 200px;min-width:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;height:auto;display:block;background:#eef1f5;aspect-ratio:1080/1350}
.card .b{padding:12px 14px 16px}
.chip{display:inline-block;font:600 11.5px "IBM Plex Mono",monospace;background:var(--chip);color:var(--accent);border-radius:999px;padding:2px 9px}
.card h2{font-size:18px;margin:8px 0 6px}
.card ol{margin:0;padding-left:20px;color:var(--fg)}
.card li{margin:4px 0}
.empty{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="/">← Portfolio</a>
  <h1 id="t">102 questions d'entretien technique, expliquées simplement</h1>
  <p class="sub" id="s"></p>
  <div class="bar" id="bar"></div>
  <div class="grid" id="grid"></div>
</div>
<script src="app.js"></script>
</body>
</html>
