<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Feuille de route – Rached Chakchouk</title>
<link rel="icon" href="/favicon-32.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
<style>
:root{--bg:#f6f7f9;--panel:#fff;--fg:#16202b;--muted:#5b6876;--line:#dde2e8;--accent:#0b6e8a;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0f151b;--panel:#161e26;--fg:#e5ebf0;--muted:#93a1ae;--line:#26313c;--accent:#4fb8d4;color-scheme:dark}}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.6 "Archivo",system-ui,sans-serif;padding:28px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
main{max-width:900px;margin:0 auto}
h1{font-size:clamp(24px,4vw,32px);line-height:1.2;margin:8px 0 4px;text-wrap:balance}
h2{font-size:20px;margin:32px 0 8px;padding-top:8px;border-top:1px solid var(--line)}
a{color:var(--accent)}
time{color:var(--muted);font-size:13px}
.tw{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;margin:12px 0}
table{border-collapse:collapse;width:100%;min-width:620px;font-size:14px}
th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
tr:last-child td{border-bottom:0}
ol li,ul li{margin:4px 0} li p{margin:0}
ul li[data-checked]{list-style:none;margin-left:-22px}
.back{display:inline-flex;gap:6px;padding:7px 14px;border:1px solid var(--line);border-radius:999px;background:var(--panel);color:var(--fg);text-decoration:none;font-size:13px;font-weight:600}
.back:hover{border-color:var(--accent);color:var(--accent)}
</style></head>
<body><main>
<p id="msg">Chargement…</p>
</main>
<script src="r.js"></script></body></html>
